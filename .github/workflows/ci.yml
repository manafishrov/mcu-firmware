name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      CLANG_FORMAT: clang-format-19
      CLANG_TIDY: clang-tidy-19
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run unit tests
        run: make test

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-19 clang-tidy-19 cmake build-essential gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
          "$CLANG_FORMAT" --version
          "$CLANG_TIDY" --version

      - name: Run clang-format check
        run: make format-check

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DPICO_SDK_FETCH_FROM_GIT=ON

      - name: Run clang-tidy lint and verify Pico memory
        run: make lint-check
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4

      - name: Build Pico 2 and verify memory
        run: make build-pico2
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4

  ci:
    name: ci
    if: always()
    needs:
      - check
    runs-on: ubuntu-24.04
    steps:
      - name: Require all checks
        env:
          CHECK_RESULT: ${{ needs.check.result }}
        run: test "$CHECK_RESULT" = success
