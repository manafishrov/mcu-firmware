name: Release Build

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+*

permissions:
  contents: write

jobs:
  build-usb-flashing-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Release tag is not SemVer: $tag" >&2
            exit 1
          fi
          header_version="$(
            awk '
              /MCU_FIRMWARE_VERSION_MAJOR/ { major = $3 }
              /MCU_FIRMWARE_VERSION_MINOR/ { minor = $3 }
              /MCU_FIRMWARE_VERSION_PATCH/ { patch = $3 }
              END { print major "." minor "." patch }
            ' src/version.h
          )"
          tag_version="${tag#v}"
          tag_version="${tag_version%%[-+]*}"
          if [[ "$tag_version" != "$header_version" ]]; then
            echo "Tag $tag does not match src/version.h ($header_version)" >&2
            exit 1
          fi

      - name: Install Arm GNU Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib

      - name: Configure CMake for Pico
        run: |
          mkdir -p build/pico
          cd build/pico
          cmake -S "$GITHUB_WORKSPACE" -B . -DCMAKE_BUILD_TYPE=Release -DPICO_SDK_FETCH_FROM_GIT=ON

      - name: Build Firmware for Pico
        run: |
          cd build/pico
          cmake --build .

      - name: Configure CMake for Pico 2
        run: |
          mkdir -p build/pico2
          cd build/pico2
          cmake -S "$GITHUB_WORKSPACE" -B . -DCMAKE_BUILD_TYPE=Release -DPICO_SDK_FETCH_FROM_GIT=ON -DPICO_BOARD=pico2

      - name: Build Firmware for Pico 2
        run: |
          cd build/pico2
          cmake --build .

      - name: Rename Assets for Release
        run: |
          cp build/pico/firmware.uf2 pico-${{ github.ref_name }}.uf2
          cp build/pico2/firmware.uf2 pico2-${{ github.ref_name }}.uf2

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            pico-${{ github.ref_name }}.uf2
            pico2-${{ github.ref_name }}.uf2
